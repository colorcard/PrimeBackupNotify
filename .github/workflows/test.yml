name: Tests

on:
  push:
    paths:
      - '.github/workflows/test.yml'
      - 'prime_backup/**'
      - 'tests/**'

jobs:
  unit_test:
    runs-on: ubuntu-latest
    name: unit tests

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'
          cache-dependency-path: '**/requirements*.txt'

      - name: Install dependencies
        run: |
          python -m pip install -U pip
          pip install pytest pytest-cov -r requirements.txt -r requirements.optional.txt

      - name: Run unit tests (including notification tests)
        run: pytest tests/ --ignore=tests/test_fuzzy_run.py -v

      - name: Display notification test results
        run: pytest tests/test_notify_utils.py -v --tb=short
        if: always()

  fuzzy_test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        seed: ['0', '1', '2', '3', '4', '5', '6', '7']
    name: fuzzy test with random seed ${{ matrix.seed }}

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'
          cache-dependency-path: '**/requirements*.txt'

      - name: Install dependencies
        run: |
          python -m pip install -U pip
          pip install pytest pytest-cov -r requirements.txt -r requirements.optional.txt

      - name: Run fuzzy test
        run: pytest tests/test_fuzzy_run.py
        env:
          PRIME_BACKUP_FUZZY_TEST_SEED: ${{ matrix.seed }}
          PRIME_BACKUP_FUZZY_TEST_ITERATION: ${{ matrix.seed == '0' && '5000' || '500' }}
